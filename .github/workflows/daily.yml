name: Collect real Daegu weather
on:
  workflow_dispatch:
  schedule:
    - cron: '20 0 * * *'
permissions:
  contents: write
concurrency:
  group: daily-temperature
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run collect
      - name: Commit actual observation and original response
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/
          git diff --staged --quiet && exit 0
          git commit -m 'data: record actual daily Daegu weather'
          git push
